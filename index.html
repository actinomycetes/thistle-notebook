<body>
<header class="topbar">
  <div class="brand">
    <svg class="app-logo" width="30" height="30" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><g transform="translate(-1 0) scale(1.08)"><g stroke="#a855f7" stroke-width="1.6" stroke-linecap="round"><path d="M12 10V2"/><path d="M12 10L7 3"/><path d="M12 10L17 3"/><path d="M12 10L4.5 6"/><path d="M12 10L19.5 6"/><path d="M12 10L9.5 2.3"/><path d="M12 10L14.5 2.3"/></g><ellipse cx="12" cy="13.5" rx="5" ry="4.2" fill="#22c55e"/><g fill="#15803d"><circle cx="9.7" cy="12.7" r=".95"/><circle cx="12.3" cy="11.9" r=".95"/><circle cx="14.7" cy="13.3" r=".95"/><circle cx="10.8" cy="15.3" r=".95"/><circle cx="13.5" cy="15.5" r=".95"/></g><path d="M12 17.5V25" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round"/><path d="M12 21.5c-2.5-.5-4.5-2-5.5-4M12 21c2.5-.5 4.3-1.8 5.3-3.8" stroke="#16a34a" stroke-width="1.4" fill="none" stroke-linecap="round"/></g><circle cx="22.5" cy="23" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.6"/><path d="M17.6 19.6q2.4-.9 4.9.7v6.6q-2.5-1.5-4.9-.7z" fill="#e0f2fe"/><path d="M27.4 19.6q-2.4-.9-4.9.7v6.6q2.5-1.5 4.9-.7z" fill="#7dd3fc"/><path d="M19 21.6h2.2M19 23.2h2.2M23.8 21.6h2.2M23.8 23.2h2.2" stroke="#0f172a" stroke-width=".6" stroke-linecap="round"/></svg>
    <span class="title">Thistle Notebook</span>
    <span class="badge-hdr beta">BETA</span>
    <span class="badge-hdr" id="app-version" title="Version">v0.2.3</span>
  </div>
  <div class="actions">
    <select id="nbSelect" title="Your notebooks (stored in this browser only)" aria-label="Notebook"></select>
    <button class="btn" id="btnNewNb" title="Create a new notebook">＋ New</button>
    <span class="sep"></span>
    <button class="btn" id="btnSave" title="Save this notebook as a .tnote file (sources' text, chat, notes)">💾 Save</button>
    <label class="btn" title="Open a saved .tnote notebook">📂 Open<input id="openInput" type="file" accept=".tnote,.json" class="file-input"></label>
    <button class="btn" id="btnNbSettings" title="Rename, privacy level or delete this notebook">✎ Notebook</button>
    <span class="sep"></span>
    <label class="inline" title="Model used for chat and Studio">Model <select id="modelSelect" aria-label="Model"></select></label>
    <label class="inline" title="Reasoning effort (only for models that support it)">Thinking <select id="reasonSelect" aria-label="Reasoning">
      <option value="default">default</option><option value="none">off</option><option value="low">low</option><option value="medium">medium</option><option value="high">high</option></select></label>
  </div>
  <div class="actions right">
    <span class="badge-hdr" id="privacyBadge" title=""></span>
    <span class="badge-hdr" id="costBadge" title="Spend on your ELM API key (updated periodically by ELM)">£ –</span>
    <button class="btn" id="btnThistle" title="Run analyses in Thistle Plot / bring statistics from Thistle Flow">🔬 Thistle apps</button>
    <button class="btn" id="btnSettings" title="API key, models and options">⚙ Settings</button>
    <button class="btn" id="btnHelp" title="Help (F1)">❓ Help</button>
    <button class="btn icon-btn" id="btnTheme" title="Toggle dark/light mode">🌙</button>
  </div>
</header>

<div class="main">
  <aside class="pane" id="paneSources">
    <div class="pane-head"><h3>Sources <small id="srcCount"></small></h3>
      <label class="check-row small" title="Tick or untick every source"><input type="checkbox" id="srcAll" checked> all</label></div>
    <div class="pane-tools">
      <label class="btn primary" title="PDF, Word, PowerPoint, Excel/CSV, text, images, audio, Thistle Plot/Flow files">＋ Add sources<input id="fileInput" type="file" multiple class="file-input"></label>
      <button class="btn" id="btnPaste" title="Paste text as a source">📋 Paste</button>
    </div>
    <ul id="srcList" class="src-list"></ul>
    <div id="dropHint" class="drop-hint">Drop files anywhere<br><small>PDF · Word · PowerPoint · Excel/CSV · text · images · audio · .tplot · .tflow</small></div>
    <div class="hint-box" id="privacyHint"></div>
  </aside>
  <div class="vsplit"></div>

  <section class="pane chat" id="paneChat">
    <div class="chat-log" id="chatLog"></div>
    <div class="composer">
      <div class="composer-tools">
        <label class="inline">Mode <select id="modeSelect"></select></label>
        <label class="inline">Audience <select id="toneSelect"></select></label>
        <label class="check-row" id="webWrap" title="Search the web through ELM (OpenAI-hosted model). Only your question is sent, not your sources."><input type="checkbox" id="webToggle"> 🌐 Web search</label>
        <label class="check-row" title="Run requested statistics in Thistle Plot automatically and send the results back for interpretation"><input type="checkbox" id="autoRunToggle" checked> 🔬 Auto-run Thistle Plot</label>
        <span class="grow"></span>
        <span class="hint" id="ctxInfo"></span>
        <button class="btn small" id="btnClearChat" title="Delete this notebook's chat history">🗑 Clear chat</button>
      </div>
      <div class="composer-row">
        <textarea id="prompt" rows="3" placeholder="Ask about your sources… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="composer-btns">
          <button class="btn primary" id="btnSend">Send</button>
          <button class="btn" id="btnStop" disabled>■ Stop</button>
        </div>
      </div>
    </div>
  </section>
  <div class="vsplit"></div>

  <aside class="pane" id="paneStudio">
    <div class="pane-head"><h3>Studio</h3></div>
    <div id="studio" class="studio"></div>
    <div class="pane-head"><h3>Notes <small id="noteCount"></small></h3>
      <button class="btn small" id="btnNewNote" title="Write a note">＋ Note</button></div>
    <ul id="noteList" class="note-list"></ul>
  </aside>
</div>

<!-- Thistle apps drawer: Thistle Plot / Thistle Flow run here, in this browser -->
<div id="suiteDrawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <nav class="tabs" id="suiteTabs"><button data-app="tp" class="active">📊 Thistle Plot</button><button data-app="tf">🧫 Thistle Flow</button></nav>
    <span class="grow"></span>
    <span id="suiteTools"></span>
    <button class="btn" id="btnCloseDrawer">✕ Close</button>
  </div>
  <div class="drawer-body"><div id="tpHost" class="frame-host"></div><div id="tfHost" class="frame-host" hidden></div></div>
</div>

<div id="modal" class="modal" hidden><div class="modal-card" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon" id="modalClose" aria-label="Close">✕</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="popover" class="popover" hidden></div>
</body>
</html>
